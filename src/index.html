<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-version" content="0.2.35">
    <meta name="app-build" content="0.2.35-2026-08-20">
    <title>Gestor Inteligente de Demandas</title>
    <link rel="stylesheet" href="/src/css/app.css">
    <link rel="icon" type="image/png" href="/src/resources/icons/app.png">
    <link rel="apple-touch-icon" href="/src/resources/icons/app.png">
    <script src="/__neutralino_globals.js"></script>
    <script src="/src/js/vendor/neutralino.js"></script>
    <script>
        // FIX v0.2.10: chamar Neutralino.init() para inicializar o WebSocket.
        document.addEventListener('DOMContentLoaded', function() {
            try {
                if (window.Neutralino && typeof window.Neutralino.init === 'function') {
                    window.Neutralino.init();
                }
            } catch (e) { console.error('[init] ERRO:', e); }
        });
    </script>
    <script>
        function showFatal(titulo, detalhe) {
            var t = document.getElementById('app') || document.body;
            t.innerHTML = '<div style="background:#1e1e1e;color:#ff6b6b;padding:24px;font-family:Consolas,monospace;min-height:100vh;white-space:pre-wrap;">'
                + '<h2 style="color:#ff6b6b;margin-bottom:12px;">' + titulo + '</h2>'
                + '<pre style="color:#ffaaaa;background:#000;padding:12px;border-radius:4px;overflow:auto;">' + String(detalhe).replace(/</g, '&lt;') + '</pre>'
                + '</div>';
        }
        window.addEventListener('error', function(e) {
            console.error('[fatal]', e.error || e.message);
            showFatal('Falha no carregamento', (e.error && e.error.stack) || e.message || String(e));
        });
    </script>
    <script src="/src/js/vendor/sql-wasm.js"></script>
    <script type="module" src="/src/js/app.js" defer></script>
</head>
<body>
    <div id="app">
        <div id="loading-screen" class="loading-screen">
            <div class="loading-content">
                <img src="/src/resources/images/logo.png" alt="Gestor" style="width:280px; height:auto; margin-bottom:20px;">
                <div class="loading-spinner"></div>
                <p>Carregando Gestor...</p>
            </div>
        </div>
    </div>

    <template id="tpl-toast">
        <div class="toast"></div>
    </template>
</body>
</html>
