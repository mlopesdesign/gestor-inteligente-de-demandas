name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Rodar testes
        run: npm test

  build:
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build (Neutralino + sql.js)
        run: node tools/build.mjs

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: gestor-inteligente-de-demandas-${{ github.sha }}
          path: |
            dist/GestorInteligenteDeDemandas
            installer/GestorInteligenteDeDemandas-Setup-*.exe
            release/resources.neu
          if-no-files-found: warn
